<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter,Arial,Helvetica,sans-serif"><rect width="800" height="450" fill="#0d1117"/><rect x="0" y="0" width="800" height="56" rx="0" fill="#161b22"/><line x1="0" y1="56" x2="800" y2="56" stroke="#30363d"/><text xml:space="preserve" x="24" y="24" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="start">IbrahimCart / ai-code-reviewer</text><text xml:space="preserve" x="24" y="44" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="start">Add user search, paging and avatars</text><rect x="318" y="30" width="52" height="20" rx="10" fill="#238636"/><text xml:space="preserve" x="344" y="44" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Open</text><text xml:space="preserve" x="788" y="24" fill="#6b7280" font-size="10" font-weight="400" text-anchor="end">Illustration, not a real screenshot</text><rect x="24" y="72" width="752" height="30" rx="6" fill="#161b22" stroke="#30363d"/><text xml:space="preserve" x="38" y="92" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">app/users.py</text><text xml:space="preserve" x="764" y="92" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+19  -0</text><rect x="24" y="109" width="752" height="22" rx="0" fill="#0d1117"/><text xml:space="preserve" x="60" y="124" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">14</text><text xml:space="preserve" x="76" y="124" fill="#e6edf3" font-size="11.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  </text><rect x="24" y="131" width="752" height="22" rx="0" fill="#12261e"/><text xml:space="preserve" x="60" y="146" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">15</text><text xml:space="preserve" x="76" y="146" fill="#aff5b4" font-size="11.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+ def search_users(name):</text><rect x="24" y="153" width="752" height="22" rx="0" fill="#12261e"/><text xml:space="preserve" x="60" y="168" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">16</text><text xml:space="preserve" x="76" y="168" fill="#aff5b4" font-size="11.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+     db = get_db()</text><rect x="24" y="175" width="752" height="22" rx="0" fill="#12261e"/><text xml:space="preserve" x="60" y="190" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">17</text><text xml:space="preserve" x="76" y="190" fill="#aff5b4" font-size="11.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+     query = "SELECT id, name, email FROM users WHERE name LIKE '%" + name + "%'"</text><rect x="24" y="197" width="752" height="22" rx="0" fill="#12261e"/><text xml:space="preserve" x="60" y="212" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">18</text><text xml:space="preserve" x="76" y="212" fill="#aff5b4" font-size="11.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+     return db.execute(query).fetchall()</text><rect x="56" y="238" width="688" height="176" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="82" cy="262" r="12" fill="#5865f2"/><text xml:space="preserve" x="82" y="266" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">AI</text><text xml:space="preserve" x="102" y="266" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="start">ai-code-reviewer</text><text xml:space="preserve" x="214" y="266" fill="#8b949e" font-size="11.5" font-weight="400" text-anchor="start">commented on line 17</text><rect x="642" y="252" width="86" height="20" rx="10" fill="#3d1a1a"/><text xml:space="preserve" x="685" y="266" fill="#ff7b72" font-size="10.5" font-weight="600" text-anchor="middle">critical</text><text xml:space="preserve" x="76" y="296" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="start">SQL injection in search_users via string concatenation</text><text xml:space="preserve" x="76" y="320" fill="#c9d1d9" font-size="12" font-weight="400" text-anchor="start">User-controlled `name` is put straight into the SQL string. Input like</text><text xml:space="preserve" x="76" y="338" fill="#c9d1d9" font-size="12" font-weight="400" text-anchor="start">' OR 1=1 -- or a UNION payload can dump or change any table.</text><rect x="76" y="354" width="3" height="46" rx="0" fill="#3fb950"/><text xml:space="preserve" x="90" y="372" fill="#8b949e" font-size="11.5" font-weight="400" text-anchor="start">Suggestion: use a parameterized query:</text><text xml:space="preserve" x="90" y="392" fill="#aff5b4" font-size="11.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">db.execute("... WHERE name LIKE ?", (f"%{name}%",))</text><text xml:space="preserve" x="400" y="436" fill="#8b949e" font-size="11" font-weight="400" text-anchor="middle">Posted as a COMMENT review. A human still decides whether to merge.</text></svg>